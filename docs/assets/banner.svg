<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Logo Colors -->
    <linearGradient id="cyanBlueB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="emeraldTealB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="goldAmberB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="948" height="268" rx="32" fill="url(#bannerBg)" stroke="#1E293B"
    stroke-width="2" />

  <!-- Subtle grid pattern lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.25">
    <line x1="280" y1="6" x2="280" y2="274" />
    <line x1="6" y1="140" x2="954" y2="140" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="140" cy="140" r="90" fill="#0284C7" opacity="0.12" filter="url(#bannerGlow)" />

  <!-- === LOGO ICON (Left) === -->
  <g transform="translate(36, 36) scale(0.406)">
    <!-- Pediment -->
    <path d="M 256 68 L 424 154 L 88 154 Z" fill="url(#cyanBlueB)" />
    <path d="M 256 86 L 396 150 L 116 150 Z" fill="#0B0F19" opacity="0.9" />
    <polygon points="256,108 266,122 256,136 246,122" fill="url(#goldAmberB)" />

    <!-- Architrave -->
    <rect x="76" y="158" width="360" height="18" rx="4" fill="#E2E8F0" />
    <rect x="88" y="180" width="336" height="8" rx="2" fill="#64748B" />

    <!-- Pillars -->
    <rect x="104" y="194" width="26" height="186" rx="4" fill="url(#cyanBlueB)" />
    <rect x="100" y="192" width="34" height="6" rx="2" fill="#E2E8F0" />
    <rect x="100" y="374" width="34" height="6" rx="2" fill="#E2E8F0" />

    <rect x="166" y="194" width="22" height="186" rx="4" fill="#94A3B8" opacity="0.85" />
    <rect x="162" y="192" width="30" height="6" rx="2" fill="#E2E8F0" />
    <rect x="162" y="374" width="30" height="6" rx="2" fill="#E2E8F0" />

    <rect x="324" y="194" width="22" height="186" rx="4" fill="#94A3B8" opacity="0.85" />
    <rect x="320" y="192" width="30" height="6" rx="2" fill="#E2E8F0" />
    <rect x="320" y="374" width="30" height="6" rx="2" fill="#E2E8F0" />

    <rect x="382" y="194" width="26" height="186" rx="4" fill="url(#cyanBlueB)" />
    <rect x="378" y="192" width="34" height="6" rx="2" fill="#E2E8F0" />
    <rect x="378" y="374" width="34" height="6" rx="2" fill="#E2E8F0" />

    <!-- Portal -->
    <path d="M 210 380 L 210 268 A 46 46 0 0 1 302 268 L 302 380 Z" fill="none"
      stroke="url(#emeraldTealB)" stroke-width="6" stroke-linecap="round" />

    <!-- Core Spark -->
    <g filter="url(#bannerGlow)">
      <path d="M 256 230 Q 256 260 286 260 Q 256 260 256 290 Q 256 260 226 260 Q 256 260 256 230 Z"
        fill="url(#goldAmberB)" />
      <circle cx="256" cy="260" r="5" fill="#FFFBEB" />
    </g>

    <!-- Base -->
    <rect x="68" y="384" width="376" height="16" rx="4" fill="#64748B" />
    <rect x="52" y="404" width="408" height="18" rx="5" fill="#CBD5E1" />
    <rect x="36" y="426" width="440" height="10" rx="4" fill="#334155" />
  </g>

  <!-- === TYPOGRAPHY & BRANDING (Right) === -->
  <text x="280" y="98"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="52" font-weight="900" letter-spacing="4" fill="url(#titleGrad)">PORTICO</text>

  <text x="282" y="142"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="22" font-weight="500" fill="#F1F5F9"
    letter-spacing="1">Agent 的治理门户与准入网关</text>

  <text x="282" y="174"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="15" font-weight="400"
    fill="#94A3B8">Agent 在别处运行 · 在这里被发布、发现、授权与访问</text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(282, 204)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="102" height="28" rx="14" fill="#1E293B" stroke="#38BDF8"
      stroke-width="1" />
    <text x="51" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"
      font-weight="600" fill="#38BDF8" text-anchor="middle">Web Portal</text>

    <!-- Pill 2 -->
    <rect x="114" y="0" width="76" height="28" rx="14" fill="#1E293B" stroke="#34D399"
      stroke-width="1" />
    <text x="152" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"
      font-weight="600" fill="#34D399" text-anchor="middle">CLI 工具</text>

    <!-- Pill 3 -->
    <rect x="202" y="0" width="118" height="28" rx="14" fill="#1E293B" stroke="#FBBF24"
      stroke-width="1" />
    <text x="261" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"
      font-weight="600" fill="#FBBF24" text-anchor="middle">MCP Protocol</text>

    <!-- Pill 4 -->
    <rect x="332" y="0" width="128" height="28" rx="14" fill="#1E293B" stroke="#A78BFA"
      stroke-width="1" />
    <text x="396" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"
      font-weight="600" fill="#A78BFA" text-anchor="middle">Deno L0 默拒沙箱</text>
  </g>
</svg>
