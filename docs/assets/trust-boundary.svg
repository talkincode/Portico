<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="trustTitle trustDesc">
  <title id="trustTitle">内部与公开的信任边界</title>
  <desc id="trustDesc">维护者在内部登记并提交公开候选。人类审计者批准后，记录才进入公网匿名可达的 approved_public。维护者不能批准自己的公开。</desc>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="840" height="520" rx="14" fill="#faf8f5"/>
  <rect x="16" y="40" width="500" height="464" rx="12" fill="#f4f1ec" stroke="#c4bdb1" stroke-width="1.5"/>
  <rect x="536" y="40" width="288" height="464" rx="12" fill="#fbeceb" stroke="#eab8b5" stroke-width="1.5"/>
  <text x="32" y="28" font-size="15" font-weight="700" fill="#191713">组织内部信任区 · Internal</text>
  <text x="552" y="28" font-size="15" font-weight="700" fill="#9e2b25">外部公网 · Public</text>

  <rect x="36" y="60" width="188" height="76" rx="8" fill="#ffffff" stroke="#191713" stroke-width="1.5"/>
  <text x="52" y="90" font-size="15" font-weight="700" fill="#191713">Agent 维护者</text>
  <text x="52" y="114" font-size="13" fill="#5c574e">Maintainer</text>

  <text x="262" y="92" text-anchor="middle" font-size="13" fill="#5c574e">register</text>
  <path d="M232 108 H302" fill="none" stroke="#191713" stroke-width="1.5"/>
  <path d="M296 102 l8 6 l-8 6" fill="none" stroke="#191713" stroke-width="1.5" stroke-linejoin="round"/>

  <rect x="310" y="60" width="186" height="88" rx="8" fill="#ffffff" stroke="#191713" stroke-width="1.5"/>
  <text x="326" y="90" font-size="15" font-weight="700" fill="#191713">Catalog 内核</text>
  <text x="326" y="114" font-size="13" fill="#5c574e">记录状态为 internal</text>

  <text x="398" y="172" text-anchor="middle" font-size="13" fill="#5c574e">publish public</text>
  <path d="M398 148 V188" fill="none" stroke="#191713" stroke-width="1.5"/>
  <path d="M392 182 l6 8 l6 -8" fill="none" stroke="#191713" stroke-width="1.5" stroke-linejoin="round"/>

  <rect x="36" y="196" width="460" height="72" rx="8" fill="#ffffff" stroke="#191713" stroke-width="1.5"/>
  <text class="mono" x="52" y="226" font-size="15" font-weight="700" fill="#191713">pending_public</text>
  <text x="250" y="226" font-size="14" fill="#191713">公开候选</text>
  <text x="52" y="250" font-size="13" fill="#5c574e">组织内可见，外部匿名仍然不可见</text>

  <text x="266" y="292" text-anchor="middle" font-size="13" fill="#5c574e">approve · 仅人类审计者，维护者不可自批</text>
  <path d="M266 268 V308" fill="none" stroke="#191713" stroke-width="1.5"/>
  <path d="M260 302 l6 8 l6 -8" fill="none" stroke="#191713" stroke-width="1.5" stroke-linejoin="round"/>

  <rect x="36" y="316" width="460" height="100" rx="8" fill="#ffffff" stroke="#191713" stroke-width="1.5"/>
  <text x="52" y="348" font-size="15" font-weight="700" fill="#191713">人类审计者 · Auditor</text>
  <text x="52" y="372" font-size="13" fill="#5c574e">查验端点与权限，签署记录至 approvals</text>
  <text x="52" y="394" font-size="13" fill="#5c574e">通过或驳回；驳回则留在内部</text>

  <text x="575" y="348" text-anchor="middle" font-size="13" fill="#9e2b25">通过审批</text>
  <path d="M496 366 H612" fill="none" stroke="#9e2b25" stroke-width="1.5"/>
  <path d="M606 360 l8 6 l-8 6" fill="none" stroke="#9e2b25" stroke-width="1.5" stroke-linejoin="round"/>

  <rect x="620" y="316" width="180" height="120" rx="8" fill="#ffffff" stroke="#9e2b25" stroke-width="1.75"/>
  <text class="mono" x="636" y="348" font-size="13" font-weight="700" fill="#9e2b25">approved_public</text>
  <text x="636" y="374" font-size="14" fill="#191713">全网匿名可达</text>
  <text x="636" y="400" font-size="13" fill="#5c574e">Portal · CLI · MCP</text>
  <text x="636" y="420" font-size="13" fill="#5c574e">同一治理状态</text>

  <text x="710" y="470" text-anchor="middle" font-size="13" fill="#5c574e">未批准的记录</text>
  <text x="710" y="490" text-anchor="middle" font-size="13" fill="#5c574e">不会出现在公网</text>
</svg>
