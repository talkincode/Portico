# Example systemd drop-in. Copy to
#   /etc/systemd/system/portico-<entrance>.service.d/override.conf
# and replace the checkout path per host. Keep PORTICO_DEPLOY_BIND as
# loopback or an RFC1918 unicast address injected at install time.
# Never commit the live address, never bind every interface.
#
# Clearing ExecStart before setting it is required: systemd concatenates
# drop-in ExecStart lines, and the unit template already has one.
[Service]
WorkingDirectory=/opt/portico
Environment=PORTICO_DEPLOY_BIND=127.0.0.1
ExecStart=
ExecStart=/opt/portico/deploy/run-portal.sh
