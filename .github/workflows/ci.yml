name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - name: lint
        run: deno lint
      - name: check
        run: deno check src/cli/main.ts src/catalog/mod.ts src/access/mod.ts src/portal/mod.ts src/portal/main.ts src/gateway/mod.ts src/gateway/main.ts
      - name: test
        run: deno test --allow-read --allow-write --allow-env --allow-run --allow-net=127.0.0.1 tests/
