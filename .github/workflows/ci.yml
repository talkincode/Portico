name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - name: fmt
        run: deno fmt --check
      - name: lint
        run: deno task lint
      - name: check
        run: deno task check
      - name: test
        run: deno task test
      - name: build
        run: deno task build
